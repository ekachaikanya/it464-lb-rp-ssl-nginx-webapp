# ═══════════════════════════════════════════════════════════════
# NGINX REVERSE PROXY with SSL/TLS
# ─────────────────────────────────────────────────────────────
# Port 80  → 301 redirect to port 8443
# Port 443 → SSL termination → HTTP app1 (1:1 proxy)
# ═══════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────────────
server {
    listen      80;
    server_name localhost;
    return 301  https://$host:8443$request_uri;
}

# ── HTTPS Reverse Proxy ────────────────────────────────────────
server {
    listen      443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 5m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Served-Via              "nginx-rp"         always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;

    access_log /var/log/nginx/rp-access.log;
    error_log  /var/log/nginx/rp-error.log;

    # ── Proxy to app1 ─────────────────────────────────────────
    location / {
        proxy_pass         http://app1:80;   # HTTP ภายใน
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Proxy-By        nginx-rp;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location /rp-status {
        stub_status on;
        access_log  off;
    }

    error_page 502 503 @app_down;
    location @app_down {
        return 503 '{"error":"app1 unavailable","status":503}';
        add_header Content-Type application/json;
    }
}
