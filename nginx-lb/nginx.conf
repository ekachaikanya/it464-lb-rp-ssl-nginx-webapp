# ═══════════════════════════════════════════════════════════════
# NGINX LOAD BALANCER with SSL/TLS Termination
# ─────────────────────────────────────────────────────────────
# Port 80  → 301 redirect to HTTPS
# Port 443 → SSL termination → HTTP backend (least_conn LB)
# ═══════════════════════════════════════════════════════════════

upstream backend {
    # Algorithm: least_conn — ส่งไป server ที่ active connections น้อยสุด
    least_conn;

    server app1:80 max_fails=3 fail_timeout=30s;
    server app2:80 max_fails=3 fail_timeout=30s;
    server app3:80 max_fails=3 fail_timeout=30s;

    # Connection pool — ลด TCP handshake overhead
    keepalive 32;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────
server {
    listen      80;
    server_name localhost;

    # Permanent redirect ไปยัง HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS Load Balancer with SSL Termination ───────────────────
server {
    listen      443 ssl;
    server_name localhost;

    # ── SSL Certificate ─────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ── TLS Protocol — ห้าม TLS 1.0/1.1 (insecure) ──────────────
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── Cipher Suites — เรียงตาม security preference ────────────
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    # ── SSL Session Cache (TLS resumption — ลด handshake overhead) ─
    ssl_session_cache   shared:SSL:10m;  # 10MB shared cache
    ssl_session_timeout 10m;
    ssl_session_tickets off;             # off เพื่อ Perfect Forward Secrecy

    # ── OCSP Stapling (ลด OCSP lookup time) ─────────────────────
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # (ใช้ได้กับ CA-signed cert เท่านั้น ไม่ใช้กับ self-signed)

    # ── Security Headers ─────────────────────────────────────────
    # HSTS: บอก browser ว่า "ใช้ HTTPS เท่านั้น" เป็นเวลา 1 ปี
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-LB-Server            "nginx-lb"      always;

    access_log /var/log/nginx/lb-access.log;
    error_log  /var/log/nginx/lb-error.log;

    # ── Main Route → Load Balanced Backend ──────────────────────
    location / {
        proxy_pass         http://backend;   # HTTP ภายใน (trusted network)
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;   # "https" — PHP อ่านได้
        proxy_set_header   X-Forwarded-By    nginx-lb;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── Nginx Status ─────────────────────────────────────────────
    location /lb-status {
        stub_status on;
        access_log  off;
    }

    # ── Error handling ───────────────────────────────────────────
    error_page 502 503 @backend_down;
    location @backend_down {
        return 503 '{"error":"backends unavailable","status":503}';
        add_header Content-Type application/json;
    }
}
